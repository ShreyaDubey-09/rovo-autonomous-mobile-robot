slam_toolbox:
  ros__parameters:

    solver_plugin: solver_plugins::CeresSolver

    odom_frame: odom
    map_frame: map
    base_frame: base_link

    scan_topic: /scan

    mode: mapping

    use_sim_time: true

    transform_publish_period: 0.02
    map_update_interval: 2.0

    resolution: 0.05

    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10

    debug_logging: true
