amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0

    max_beams: 60
    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    update_min_a: 0.2
    update_min_d: 0.25

    resample_interval: 1
    transform_tolerance: 1.0

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    tf_broadcast: true

    set_initial_pose: true
    always_reset_initial_pose: false

    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/shreya/robot_ws/install/rovo_bringup/share/rovo_bringup/maps/amr_map.yaml"


planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: True

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      min_vel_x: 0.0
      min_vel_y: 0.0

      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 1.2

      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0

      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.8

      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 30

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.10

      short_circuit_trajectory_evaluation: True
      stateful: True

      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist"
        ]

      BaseObstacle.scale: 0.03

      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20

      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.20

      PathDist.scale: 32.0
      GoalDist.scale: 20.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      use_sim_time: True

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.30

      plugins: ["voxel_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"

        enabled: True
        publish_voxel_map: True

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16

        max_obstacle_height: 2.0
        mark_threshold: 0

        observation_sources: scan

        scan:
          topic: /scan

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          data_type: "LaserScan"

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link

      use_sim_time: True

      robot_radius: 0.30

      resolution: 0.05

      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: True

        observation_sources: scan

        scan:
          topic: /scan

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          data_type: "LaserScan"

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: True


behavior_server:
  ros__parameters:
    use_sim_time: True

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

    cycle_frequency: 10.0

    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: True

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

    bt_loop_duration: 10
    default_server_timeout: 20

    enable_groot_monitoring: false


waypoint_follower:
  ros__parameters:
    use_sim_time: True

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0


velocity_smoother:
  ros__parameters:
    use_sim_time: True

    smoothing_frequency: 20.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    max_velocity:
      [0.35, 0.0, 1.2]

    min_velocity:
      [-0.35, 0.0, -1.2]

    max_accel:
      [0.4, 0.0, 0.8]

    max_decel:
      [-0.5, 0.0, -1.0]

    odom_topic: /odom

    odom_duration: 0.1

    deadband_velocity:
      [0.0, 0.0, 0.0]

    velocity_timeout: 1.0


lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True

    autostart: true

    node_names:
      - map_server
      - amcl


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True

    autostart: true

    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
